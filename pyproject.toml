[project]
name = "jedwal"
version = "0.1.0"
description = "A modular FastAPI application following Netflix Dispatch patterns"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.5.0",
    "boto3>=1.35.0",
    "boto3-stubs[dynamodb]>=1.40.63",
    "gspread>=6.2.1",
    "requests>=2.32.5",
    "cryptography>=46.0.3",
    "authlib==1.3.1",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.1",
    "randomname>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "moto>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
