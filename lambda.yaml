Transform: AWS::Serverless-2016-10-31

Description: |
  This template uses the AWS Serverless Application Model (AWS SAM) to deploy
  the FastAPI App as a Lambda function behind an API Gateway. The Lambda function
  is built from a Docker image stored in Amazon ECR.

  The template also hooks up a Route 53 DNS record to the API Gateway custom domain,
  and a CloudFront distribution to the API Gateway.

  This is slower than the ecs.yaml template, but it's more cost-effective for 
  low-traffic.

Parameters:
  ImageUri:
    Type: String
    Description: ECR Image URI
    NoEcho: true

  AnalyticsImageUri:
    Type: String
    Description: ECR Image URI for the analytics function
    NoEcho: true

  Environment:
    Type: String
    Description: Environment
    Default: prod

  DomainName:
    Type: String
    Description: The base domain name for the API
    Default: jedwal.co

  GoogleClientId:
    Description: The Google Client ID
    Type: String
    NoEcho: true

  GoogleClientSecret:
    Description: The Google Client Secret
    Type: String
    NoEcho: true

  OAuthSecretToken:
    Description: The OAuth Secret Token
    Type: String
    NoEcho: true

  SentryDSN:
    Description: The Sentry DSN
    Type: String
    NoEcho: true

  StripeSecretKey:
    Description: Stripe Secret API key
    Type: String
    NoEcho: true

  StripeWebhookSecret:
    Description: Stripe webhook URL
    Type: String
    NoEcho: true

  ApiBaseUrl:
    Description: The URL of the backend API
    Type: String

  ClientBaseUrl:
    Description: The Client base URL
    Type: String

  ClientAppBaseUrl:
    Description: The URL for the client dashboard
    Type: String

  CloudFrontDistributionId:
    Description: "Cloudfront ID generated for the CloudFrontDistribution. Taken from the AWS console"
    Type: String
    NoEcho: true

  CookieAllowedDomain:
    Description: Authorized origins for authorization headers
    Type: String
    Default: ".jedwal.co"

Resources:
  # KMS Key for Envelope Encryption
  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "KMS key for envelope encryption of sensitive data"
      KeyPolicy:
        Version: "2012-10-17"
        Id: key-policy-1
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow Lambda to use the key
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
      EnableKeyRotation: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # KMS Key Alias for easier reference
  EncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${Environment}-sheetsapi-encryption-key"
      TargetKeyId: !Ref EncryptionKey

  # SES Configuration Set for Email Tracking
  # After first deploy, need to set up Email sending in the console.
  SESConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub "${Environment}-sheetsapi-emails"

  # SES Email Identity for sending emails
  SESEmailIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: "hello@jedwal.co"

  # API Function
  LambdaApi:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 1024 # mb
      Environment:
        Variables:
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          OAUTH_SECRET_TOKEN: !Ref OAuthSecretToken
          ENVIRONMENT: !Ref Environment
          SHEETS_API_TABLE: !Ref DynamoDBTableV2
          SENTRY_DSN: !Ref SentryDSN
          API_BASE_URL: !Ref ApiBaseUrl
          CLIENT_BASE_URL: !Ref ClientBaseUrl
          CLIENT_APP_BASE_URL: !Ref ClientAppBaseUrl
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          COOKIE_ALLOWED_DOMAIN: !Ref CookieAllowedDomain
          ENCRYPTION_KEY_ID: !Ref EncryptionKey
          EMAILS_ENABLED: "true"
          SES_CONFIGURATION_SET: !Ref SESConfigurationSet
          SES_DEFAULT_FROM_EMAIL: "hello@jedwal.co"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Policies:
        - PolicyName: CloudFrontInvalidationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistributionId}
        - PolicyName: KMSEncryptionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !GetAtt EncryptionKey.Arn
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Sub "${Environment}"
      DefinitionBody:
        swagger: "2.0"
        info:
          title: !Ref AWS::StackName
        paths:
          /:
            x-amazon-apigateway-any-method:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaApi.Arn}/invocations"
              responses: {}
          /{proxy+}:
            x-amazon-apigateway-any-method:
              x-amazon-apigateway-integration:
                httpMethod: POST
                type: aws_proxy
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaApi.Arn}/invocations"
              responses: {}

  # API Gateway Usage Plan for Rate Limiting
  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiGateway
    Properties:
      UsagePlanName: !Sub "${AWS::StackName}-usage-plan"
      Description: "Usage plan to prevent API abuse"
      ApiStages:
        - ApiId: !Ref ApiGateway
          Stage: !Sub "${Environment}"
      Quota:
        Limit: 2000
        Period: DAY
      Throttle:
        RateLimit: 50
        BurstLimit: 100

  LambdaApiGatewayInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaApi
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/*/*"

  # DNS and Custom Domain Hosting
  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub "api.${DomainName}"
      ValidationMethod: DNS

  ApiDomainName:
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Sub "api.${DomainName}"
      RegionalCertificateArn: !Ref ApiCertificate
      EndpointConfiguration:
        Types:
          - REGIONAL

  ApiMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref ApiDomainName
      RestApiId: !Ref ApiGateway
      Stage: !Sub "${Environment}"
    DependsOn:
      - ApiGatewayStage # See https://github.com/aws/serverless-application-model/issues/192#issuecomment-406834837

  ApiDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: !Sub "${DomainName}."
      Name: !Sub "api.${DomainName}."
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront Hosted Zone ID

  DynamoDBTableV2:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: prod-sheetsapi-table-v2
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: prod

  LambdaStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref AnalyticsImageUri
      Role: !GetAtt LambdaStreamFunctionExecutionRole.Arn
      Timeout: 30
      Environment:
        Variables:
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          OAUTH_SECRET_TOKEN: !Ref OAuthSecretToken
          ENVIRONMENT: !Ref Environment
          SHEETS_API_TABLE: !Ref DynamoDBTableV2
          SENTRY_DSN: !Ref SentryDSN
          API_BASE_URL: !Ref ApiBaseUrl
          CLIENT_BASE_URL: !Ref ClientBaseUrl
          CLIENT_APP_BASE_URL: !Ref ClientAppBaseUrl
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          CLOUDFRONT_DISTRIBUTION_ID: !Ref CloudFrontDistributionId
          COOKIE_ALLOWED_DOMAIN: !Ref CookieAllowedDomain
          ENCRYPTION_KEY_ID: !Ref EncryptionKey
          EMAILS_ENABLED: "true"
          SES_CONFIGURATION_SET: !Ref SESConfigurationSet
          SES_DEFAULT_FROM_EMAIL: "hello@jedwal.co"

  LambdaStreamFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaS3InvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::cloudfront-logs-${AWS::Region}-sheetsapi-${Environment}"
                  - !Sub "arn:aws:s3:::cloudfront-logs-${AWS::Region}-sheetsapi-${Environment}/*"
        - PolicyName: LambdaDynamoDBWritePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt DynamoDBTableV2.Arn
                  - !Sub "${DynamoDBTableV2.Arn}/index/GSI1"
                  - !Sub "${DynamoDBTableV2.Arn}/index/GSI2" # global secondary index perms
        - PolicyName: KMSEncryptionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !GetAtt EncryptionKey.Arn
        - PolicyName: SESPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt LambdaStreamFunction.Arn
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::cloudfront-logs-${AWS::Region}-sheetsapi-${Environment}"

  CloudFrontLogsBucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaInvokePermission
    Properties:
      BucketName: !Sub "cloudfront-logs-${AWS::Region}-sheetsapi-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteLogs
            Status: Enabled
            ExpirationInDays: 7
      AccessControl: LogDeliveryWrite
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt LambdaStreamFunction.Arn

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultCacheBehavior:
          TargetOriginId: ApiGatewayOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Headers:
              - Origin
              - Access-Control-Request-Headers
              - Access-Control-Request-Method
            Cookies:
              Forward: none
          DefaultTTL: 0
          MaxTTL: 0
          MinTTL: 0
        Origins:
          - Id: ApiGatewayOrigin
            DomainName: !Sub "${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com"
            OriginPath: !Sub "/${Environment}"
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
            OriginCustomHeaders:
              - HeaderName: "X-Forwarded-Host"
                HeaderValue: !Sub "api.${DomainName}"
        CacheBehaviors:
          - PathPattern: "/api/*"
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: true
              Headers:
                - Origin
                - Access-Control-Request-Headers
                - Access-Control-Request-Method
              Cookies:
                Forward: none # User session cookies are messing up the cache
            DefaultTTL: 15
            MaxTTL: 86400
            MinTTL: 1
          - PathPattern: "*"
            TargetOriginId: ApiGatewayOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: true
              Headers:
                - Origin
                - Access-Control-Request-Headers
                - Access-Control-Request-Method
              Cookies:
                Forward: all
            DefaultTTL: 0
            MaxTTL: 0
            MinTTL: 0
        ViewerCertificate:
          AcmCertificateArn: !Ref ApiCertificate
          SslSupportMethod: sni-only
        Aliases:
          - !Sub "api.${DomainName}"
        Logging:
          Bucket: !GetAtt CloudFrontLogsBucket.RegionalDomainName
          Prefix: !Sub "${Environment}/"
          IncludeCookies: false

Outputs:
  ApiDomainName:
    Description: "API Domain Name"
    Value: !Ref ApiDomainName

  EncryptionKeyId:
    Description: "KMS Key ID for Envelope Encryption"
    Value: !Ref EncryptionKey

  EncryptionKeyArn:
    Description: "KMS Key ARN for Envelope Encryption"
    Value: !GetAtt EncryptionKey.Arn

  EncryptionKeyAlias:
    Description: "KMS Key Alias for Envelope Encryption"
    Value: !Ref EncryptionKeyAlias

  SESConfigurationSetName:
    Description: "SES Configuration Set Name"
    Value: !Ref SESConfigurationSet

  SESEmailIdentity:
    Description: "SES Email Identity"
    Value: !Ref SESEmailIdentity
